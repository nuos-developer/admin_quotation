<div class="login-wrapper">

  <div class="login-card">

    <!-- LOGO -->
    <div class="logo">
      <img src="https://nuos.in/wp-content/uploads/2023/06/logo.png" alt="NUOS Logo" />
    </div>

    <h2>Admin Login</h2>
    <p class="subtitle">Sign in to manage your NUOS workspace</p>

    <form class="login-form" (ngSubmit)="login()">

      <!-- EMAIL -->
      <div class="form-group">
        <label for="email_id">Email ID</label>
        <input pInputText id="email_id" type="email" placeholder="Enter email" name="email_id"
          [(ngModel)]="email_id" />
        <small class="error-msg" *ngIf="submitted && !email_id.trim()">Email is required.</small>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label for="password">Password</label>
        <p-password id="password" name="password" placeholder="Enter password" [(ngModel)]="password"
          [toggleMask]="true" [feedback]="false" styleClass="password-field"></p-password>
        <small class="error-msg" *ngIf="submitted && !password">Password is required.</small>
      </div>

      <p-button type="submit" label="Login" styleClass="login-btn" [loading]="isSubmitting"></p-button>

    </form>

  </div>

</div>
